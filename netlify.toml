# Leftover Squarespace /blog/* URLs. Must stay AFTER the specific
# /blog/blog-post-title-two-69fdy rule so that slug still maps to the
# Excelle article (first-match-wins). /blog itself is the old index.
[[redirects]]
  from = "/blog"
  to = "/playbook/"
  status = 301

[[redirects]]
  from = "/blog/*"
  to = "/playbook/:splat/"
  status = 301

# Catch-all fallback for any old playbook URL not matched by a specific rule above.
# Must stay LAST among the /thekitchendealerplaybook rules (first-match-wins).
[[redirects]]
  from = "/thekitchendealerplaybook/*"
  to = "/playbook/:splat/"
  status = 301

# Keep sitemap XML as application/xml even if a fetcher sends Accept: text/html
# or a trailing slash. charset UTF-8 is explicit for GSC / Googlebot.
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=UTF-8"

[[headers]]
  for = "/sitemap.xml/"
  [headers.values]
    Content-Type = "application/xml; charset=UTF-8"

[[headers]]
  for = "/sitemap-index.xml"
  [headers.values]
    Content-Type = "application/xml; charset=UTF-8"

[[headers]]
  for = "/sitemap-index.xml/"
  [headers.values]
    Content-Type = "application/xml; charset=UTF-8"

[[headers]]
  for = "/sitemap-0.xml"
  [headers.values]
    Content-Type = "application/xml; charset=UTF-8"

[[headers]]
  for = "/sitemap-0.xml/"
  [headers.values]
    Content-Type = "application/xml; charset=UTF-8"

[[headers]]
  for = "/video-sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=UTF-8"

[[headers]]
  for = "/video-sitemap.xml/"
  [headers.values]
    Content-Type = "application/xml; charset=UTF-8"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

